plugins {
    id 'com.android.application'
}
android {
    namespace 'com.strokedot.extradim'
    compileSdk 35
    defaultConfig {
        applicationId 'com.strokedot.extradim'
        minSdk 31
        targetSdk 35
        versionCode 25
        versionName '0.15.10'
    }
    // Long-lived private key provided ONLY through GitHub Actions secrets.
    signingConfigs {
        ota {
            def keystoreFile = System.getenv("LUMASHADE_KEYSTORE")
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv("LUMASHADE_STORE_PASSWORD")
                keyAlias System.getenv("LUMASHADE_KEY_ALIAS") ?: "lumashade"
                keyPassword System.getenv("LUMASHADE_KEY_PASSWORD") ?: System.getenv("LUMASHADE_STORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Normal installable APK: debug-only testOnly flag is excluded.
            signingConfig signingConfigs.ota
            minifyEnabled false
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
