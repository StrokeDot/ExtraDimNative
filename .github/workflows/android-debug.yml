name: Build LumaShade APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "SDK Manager missing"; exit 1; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Give APK the app name and version
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LumaShade-v${VERSION}-testonly-debug.apk"
          sha256sum "dist/LumaShade-v${VERSION}-testonly-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LumaShade-Android-APK
          if-no-files-found: error
          path: dist/LumaShade-v*-testonly-debug.apk
