name: Build Extra Dim APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Show APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ExtraDimNative-v0.4-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk
